parameters:
- name: 'NodeVersion'
  default: '22.x'
  type: string

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '${{ parameters.NodeVersion }}'
    displayName: 'Install Node.js ${{ parameters.NodeVersion }}'

  - script: |
      node -e "console.log('##vso[task.setvariable variable=npm_config_before]' + new Date(Date.now() - 7 * 86400000).toISOString())"
    displayName: 'Apply npm quarantine window'

  - template: /eng/common/pipelines/templates/steps/create-authenticated-npmrc.yml
    parameters:
      npmrcPath: $(Build.SourcesDirectory)/common/config/rush/.npmrc

  - script: 'node common/scripts/install-run-rush.js install'
    displayName: 'rush install'

  - script: 'node common/scripts/install-run-rush.js rebuild --verbose'
    displayName: 'rush build'