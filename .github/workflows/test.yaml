name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu, windows]
        node-version: [20, 24]
        exclude:
          - os: ubuntu
            node-version: 24
          - os: windows
            node-version: 20

    runs-on: ${{ fromJSON('{"ubuntu":"ubuntu-24.04", "windows":"windows-2022"}')[matrix.os] }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node ${{ matrix.node-version }}.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}.x

      - name: rush install
        run: node common/scripts/install-run-rush.js install

      - name: rush build
        run: node common/scripts/install-run-rush.js build --verbose

      - name: rush lint
        run: node common/scripts/install-run-rush.js lint

      - name: rush test
        run: node common/scripts/install-run-rush.js test

      - name: rush regen-ruleindex
        run: node common/scripts/install-run-rush.js regen-ruleindex

      - name: rush pack
        if: contains(matrix.os, 'ubuntu')
        run: node common/scripts/install-run-rush.js pack

      - name: Upload npm packages
        if: contains(matrix.os, 'ubuntu')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: |
            packages/**/*.tgz
            !packages/**/node_modules/**
          if-no-files-found: error
